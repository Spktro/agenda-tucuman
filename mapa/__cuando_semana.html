        const CENTRO = [-26.8303, -65.2038];
        const mapa = crearMapa("mapa", CENTRO, 14);

        const porLugar = {}, limites = [];
        for (const p of puntos) (porLugar[`${p.lat.toFixed(4)},${p.lon.toFixed(4)}`] ??= []).push(p);
        for (const lista of Object.values(porLugar)) {
            const { lat, lon, lugar } = lista[0];
            const html = `<strong>${escapar(lugar ?? "")}</strong>` +
                lista.map(p => `<div class="mt-1"><a href="#" data-ficha-abrir="${p.id}">${escapar(p.titulo)}</a><br><small>${escapar(p.categoria)} · ${escapar(p.cuando)}</small></div>`).join("");
            const radio = Math.min(14, 6 + lista.length * 1.5);
            L.circleMarker([lat, lon], { radius: radio, color: "#ff5a4f", fillColor: "#ff5a4f", fillOpacity: .8, weight: 2 })
                .addTo(mapa).bindPopup(html);
            limites.push([lat, lon]);
        }
        const cercanos = limites.filter(p => distanciaKm(CENTRO, p) < 15);
        if (cercanos.length > 1) mapa.fitBounds(cercanos, { padding: [60, 40], maxZoom: 15 });

        // Desde el globo se abre la ficha (la misma ventana que en la agenda).
        mapa.on("popupopen", ev => ev.popup.getElement().querySelectorAll("[data-ficha-abrir]").forEach(a => a.addEventListener("click", e => {
            e.preventDefault();
            const falsa = document.createElement("div");
            falsa.dataset.ficha = a.dataset.fichaAbrir;
            document.body.appendChild(falsa);
            falsa.click();
            falsa.remove();
        })));

        let marcadorYo = null;
        Ubicacion.alCambiar(yo => {
            marcadorYo?.remove();
            marcadorYo = L.circleMarker(yo, { radius: 8, color: "#4da3ff", fillColor: "#4da3ff", fillOpacity: .9 }).addTo(mapa).bindPopup("Estás acá");
        });
        document.getElementById("yo").addEventListener("click", async () => {
            const yo = Ubicacion.actual ?? await Ubicacion.pedir();
            if (yo) mapa.setView(yo, 15);
        });

        function escapar(t) { const d = document.createElement("div"); d.textContent = t ?? ""; return d.innerHTML; }
